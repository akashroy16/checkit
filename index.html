<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 4th Anniversary 💜</title>
<style>
:root{--bg1:#f3ecff;--bg2:#d9c8f5;--ink:#4a3570;--soft:#7b62a8;--card:rgba(255,255,255,.65);--heart:#a56cf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a2040;--bg2:#1a1330;--ink:#efe6ff;--soft:#c3a9f0;--card:rgba(255,255,255,.08);--heart:#b98aff}}
:root[data-theme="dark"]{--bg1:#2a2040;--bg2:#1a1330;--ink:#efe6ff;--soft:#c3a9f0;--card:rgba(255,255,255,.08);--heart:#b98aff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow-x:hidden}
.wrap{position:relative;z-index:2;width:100%;max-width:520px;padding:24px}
h1{font-weight:400;font-size:1.9rem;margin:.2em 0 .1em;letter-spacing:.5px}
p.sub{color:var(--soft);margin:0 0 28px;font-style:italic}
.heart{width:110px;height:100px;margin:0 auto 18px;fill:var(--heart);animation:beat 1.4s infinite;filter:drop-shadow(0 6px 14px rgba(150,100,230,.45))}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
button{font:inherit;font-size:1.05rem;color:#fff;background:linear-gradient(135deg,#b58cf5,#8f62dd);border:0;border-radius:999px;
padding:14px 34px;cursor:pointer;box-shadow:0 8px 22px rgba(130,90,210,.4);transition:transform .2s}
button:hover{transform:translateY(-2px) scale(1.03)}
#card{display:none;background:var(--card);backdrop-filter:blur(8px);border-radius:22px;padding:28px 22px;
box-shadow:0 10px 40px rgba(120,80,200,.25);animation:rise .9s ease both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
#msg{white-space:pre-wrap;line-height:1.75;font-size:1.1rem;min-height:12em;text-align:left}
.cursor::after{content:"|";animation:blink 1s infinite;color:var(--heart)}
@keyframes blink{50%{opacity:0}}
#after{display:none;margin-top:18px;animation:rise .9s ease both}
.big{font-size:2.1rem;color:var(--heart);margin:8px 0}
.hint{color:var(--soft);font-style:italic;margin:14px 0 14px}
#reply{display:none;margin-top:18px;animation:rise .9s ease both}
.bubble{display:inline-block;background:linear-gradient(135deg,#b58cf5,#8f62dd);color:#fff;border-radius:20px 20px 4px 20px;padding:10px 18px;font-size:1.1rem}
.gotcha{color:var(--soft);font-style:italic;margin-top:14px;line-height:1.6}
#spark{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:3;font-size:22px;background:none;box-shadow:none;padding:6px;opacity:.55;animation:blink 2.2s infinite}
.float{position:fixed;bottom:-40px;z-index:1;pointer-events:none;animation:up linear forwards;opacity:.7}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <div id="intro">
    <svg class="heart" viewBox="0 0 32 29"><path d="M16 28C-9 12 4-4 16 6 28-4 41 12 16 28z"/></svg>
    <h1>I made something for you</h1>
    <p class="sub">Tap below, my love</p>
    <button id="open">Click to open 💜</button>
  </div>
  <div id="card">
    <svg class="heart" style="width:70px;height:64px" viewBox="0 0 32 29"><path d="M16 28C-9 12 4-4 16 6 28-4 41 12 16 28z"/></svg>
    <div id="msg" class="cursor"></div>
    <div id="after">
      <div class="big">I love you 💜</div>
      <p class="hint">Now be honest... I need one little thing from you 🥺</p>
      <button id="hug">Send me a hug 🤗</button>
      <div id="reply">
        <div class="bubble">I love you too 💜</div>
        <p class="gotcha">Gotcha. You just said it 😌<br>I'm keeping this forever, my love 💜</p>
      </div>
    </div>
  </div>
  <button id="spark" title="psst">✨</button>
  <div style="display:none">
  </div>
</div>
<script>
var text = "Looking back at the last 4 years,\nI\u2019m so grateful for everything we\u2019ve built together despite the distance.\n\nYou\u2019re my favorite part of every day,\nand after 3 long years, I\u2019m dying to finally see you and hold you.\n\nHappy 4th Anniversary! \uD83D\uDC9C";
var started = false, replied = false;
document.getElementById('spark').style.display = 'none';
function showAfter(){
  document.getElementById('after').style.display = 'block';
  document.getElementById('spark').style.display = 'block';
}
function reveal(){
  if (replied) return;
  replied = true;
  document.getElementById('hug').style.display = 'none';
  document.getElementById('spark').style.display = 'none';
  document.querySelector('.hint').style.display = 'none';
  document.getElementById('reply').style.display = 'block';
  for (var i = 0; i < 30; i++) setTimeout(floatHeart, i*100);
}
document.getElementById('hug').addEventListener('click', reveal);
document.getElementById('spark').addEventListener('click', reveal);
function floatHeart(){
  var h = document.createElement('div');
  h.className = 'float';
  h.textContent = ['\uD83D\uDC9C','\uD83D\uDC9C','\uD83E\uDD0D','\u2728'][Math.floor(Math.random()*4)];
  h.style.left = Math.random()*100 + 'vw';
  h.style.fontSize = (14 + Math.random()*22) + 'px';
  h.style.animationDuration = (5 + Math.random()*5) + 's';
  document.body.appendChild(h);
  setTimeout(function(){ h.remove(); }, 10500);
}
function type(i){
  var el = document.getElementById('msg');
  var chars = Array.from(text);
  if (i <= chars.length) {
    el.textContent = chars.slice(0, i).join('');
    setTimeout(function(){ type(i+1); }, chars[i-1] === '\n' ? 350 : 55);
  } else {
    el.classList.remove('cursor');
    setTimeout(showAfter, 800);
  }
}
document.getElementById('open').addEventListener('click', function(){
  if (started) return;
  started = true;
  document.getElementById('intro').style.display = 'none';
  document.getElementById('card').style.display = 'block';
  for (var i = 0; i < 12; i++) setTimeout(floatHeart, i*150);
  setInterval(floatHeart, 600);
  setTimeout(function(){ type(1); }, 900);
});
</script>
</body>
</html>
